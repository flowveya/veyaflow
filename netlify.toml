[build]
  functions = "netlify/functions"
  publish   = "."

[functions]
  # Use Node.js 20 for all functions
  node_bundler = "esbuild"

# Trigger 8 BIL Use Case A — F2a lock (vision PDF extraction via Anthropic API).
# Harness-measured p95 ~10s on a dense single-page deck; ceiling provides headroom
# for multi-page extractions up to F3.1's 15-page cap. Netlify support enabled a
# 30s function ceiling for this site on 2 Jun 2026 (requested 26; granted 30).
# REQUIRES a redeploy to activate the raised ceiling — committing this value alone
# is not sufficient; the site must be deployed again after the support change.
[functions."anthropic-proxy"]
  timeout = 30

# Redirect /dpp/:dppId to the static DPP viewer HTML
# The viewer JS then calls /.netlify/functions/get-dpp?id=:dppId
[[redirects]]
  from   = "/dpp/*"
  to     = "/dpp/index.html"
  status = 200

# Redirect /brand/:shareId to the static viewer HTML
# The viewer JS then calls the Netlify function with the shareId
[[redirects]]
  from   = "/brand/*"
  to     = "/brand/index.html"
  status = 200

# ── Internal documents are NOT part of the website (finding #99, 2 Sep 2026) ──
# `publish = "."` above makes the REPO ROOT the web root, so every tracked file
# is fetchable by name. On 2 Sep the spec archive, the coding lane's backlog and
# the verification harness were committed and went live within minutes —
# including a paragraph describing ~13 RLS-enabled tables with zero policies and
# session_id as an unexpiring bearer value. Confirmed by loading
# veyaflow.netlify.app/CODING_STATUS.md in a browser.
#
# `force = true` is what makes these beat the static file. WITHOUT IT NETLIFY
# SERVES THE FILE THAT EXISTS and these rules do nothing.
#
# These MUST stay above the `/*` catch-all below — rules are evaluated in order.
#
# Scoped from `git ls-files` on 2 Sep 2026 — every tracked file that is not one
# of the four app surfaces. THE FOUR THAT STAY PUBLIC, deliberately:
#   index.html · portal.html · dpp/index.html · brand/index.html
# Function INVOCATION is unaffected: functions are called at /.netlify/functions/*
# (leading dot), which is a different path from the /netlify/* static route
# blocked below. Verified 2 Sep that both an exact path and a splat rule work.
#
# WHEN YOU ADD A TRACKED FILE TO THE REPO ROOT, IT IS PUBLIC UNTIL YOU ADD A RULE
# HERE. That is the weakness of blocking by enumeration and the reason the real
# fix is to move the app into its own directory and set `publish` to it, making
# public the exception rather than the default. Until then this list is a control
# that depends on someone remembering.

# ── The lane's own documents ──
[[redirects]]
  from = "/CODING_STATUS.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/veyaflow-specs/*"
  to = "/index.html"
  status = 404
  force = true

# ── Verification harness ──
[[redirects]]
  from = "/verify.js"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/verify.sh"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/verify.expected.txt"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/verify.baseline.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/ast_verify.js"
  to = "/index.html"
  status = 404
  force = true

# ── Schema, build and deploy configuration ──
[[redirects]]
  from = "/db/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true

# Function SOURCE is published as static files because the functions directory
# sits inside the publish directory, which it does only because `publish = "."`.
# Two rules, deliberately: on 2 Sep `/netlify/*` alone did not take, and it was
# not established whether the deploy had landed or the pattern does not match.
# The more specific form uses the same shape as `/veyaflow-specs/*`, which IS
# proven to work on this site. Blocking these cannot affect the functions
# themselves — they are invoked at /.netlify/functions/* (leading dot), verified
# 2 Sep by publishing a DPP to v3 with the first of these rules already live.
[[redirects]]
  from = "/netlify/functions/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/index.html"
  status = 404
  force = true

# ── Stray root-level function copy (tracked, unlike the other five) ──
[[redirects]]
  from = "/supabase-proxy.js"
  to = "/index.html"
  status = 404
  force = true

# ── Harness and pipeline scripts ──
