[build]
  functions = "netlify/functions"
  publish   = "."

[functions]
  # Use Node.js 20 for all functions
  node_bundler = "esbuild"

# Trigger 8 BIL Use Case A — F2a lock (vision PDF extraction via Anthropic API).
# Harness-measured p95 ~10s on a dense single-page deck; ceiling provides headroom
# for multi-page extractions up to F3.1's 15-page cap. Netlify support enabled a
# 30s function ceiling for this site on 2 Jun 2026 (requested 26; granted 30).
# REQUIRES a redeploy to activate the raised ceiling — committing this value alone
# is not sufficient; the site must be deployed again after the support change.
[functions."anthropic-proxy"]
  timeout = 30

# Redirect /dpp/:dppId to the static DPP viewer HTML
# The viewer JS then calls /.netlify/functions/get-dpp?id=:dppId
[[redirects]]
  from   = "/dpp/*"
  to     = "/dpp/index.html"
  status = 200

# Redirect /brand/:shareId to the static viewer HTML
# The viewer JS then calls the Netlify function with the shareId
[[redirects]]
  from   = "/brand/*"
  to     = "/brand/index.html"
  status = 200

# ── Internal documents are NOT part of the website (finding #99, 2 Sep 2026) ──
# `publish = "."` above makes the REPO ROOT the web root, so every tracked file
# is fetchable by name. On 2 Sep the spec archive, the coding lane's backlog and
# the verification harness were committed and went live within minutes —
# including a paragraph describing ~13 RLS-enabled tables with zero policies and
# session_id as an unexpiring bearer value. Confirmed by loading
# veyaflow.netlify.app/CODING_STATUS.md in a browser.
#
# `force = true` is what makes these beat the static file. WITHOUT IT NETLIFY
# SERVES THE FILE THAT EXISTS and these rules do nothing.
#
# These MUST stay above the `/*` catch-all below — rules are evaluated in order.
#
# NOT YET COMPLETE: scoped from what is known to be committed, not from
# `git ls-files`. Anything tracked at the repo root and not listed here is still
# public. Finish the sweep before treating #99 as closed.

[[redirects]]
  from   = "/CODING_STATUS.md"
  to     = "/index.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/veyaflow-specs/*"
  to     = "/index.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/db/*"
  to     = "/index.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/verify.js"
  to     = "/index.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/verify.sh"
  to     = "/index.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/verify.expected.txt"
  to     = "/index.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/verify.baseline.json"
  to     = "/index.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/ast_verify.js"
  to     = "/index.html"
  status = 404
  force  = true

# Friendly 404 page
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[context.production.environment]
  # These are read by Netlify functions — set actual values in Netlify dashboard
  # SUPABASE_URL       = "https://your-project.supabase.co"
  # SUPABASE_SERVICE_KEY = "eyJ..."   (service role — functions/share-brand-pack.js, share-dpp.js)
  # SUPABASE_ANON_KEY    = "eyJ..."   (anon — functions/get-brand-pack.js, get-dpp.js)
